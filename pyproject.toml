[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bikeflow"
version = "0.1.0"
description = "BikeFlow hourly bike-rental demand API scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]
# Training and offline evaluation only. Kept out of the runtime dependencies so
# the API image does not carry torch; the serving adapter imports them lazily.
ml = [
    "joblib>=1.4,<2.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=17.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "scikit-learn>=1.5,<2.0",
    "tabulate>=0.9,<1.0",
    "torch>=2.6,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
